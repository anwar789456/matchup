<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes matchs · Aucun match</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-sans)">
<x-import component-from-global-scope="MatchUp.TopAppBar" variant="large" title="Mes matchs" collapsed="{{yes}}" scrolled="{{no}}" inset="{{inset}}" actions="{{barActions}}"></x-import>
<div style="padding: 0 16px; background: var(--bg)">
<x-import component-from-global-scope="MatchUp.Tabs" label="Mes matchs" items="{{tabs}}" value="avenir" full-width="{{yes}}" id-base="mat-tab"></x-import>
</div>
<div id="mat-panel-avenir" role="tabpanel" aria-labelledby="mat-tab-avenir" style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; justify-content: center; padding: 16px 16px 176px 16px">
<x-import component-from-global-scope="MatchUp.EmptyState" illustration="bookings" title="Aucun match à venir" description="Rejoins une partie à ton niveau, ou réserve un terrain et invite tes amis."></x-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 8px 24px 0 24px">
<a href="EXP-01-Explorer-parties.dc.html" class="mu-btn mu-btn--primary mu-btn--l mu-btn--block"><span class="mu-btn__content"><x-import component-from-global-scope="MatchUp.Icon" name="compass" size="{{i20}}"></x-import><span class="mu-btn__label label-l">Trouver une partie</span></span></a>
<a href="EXP-03-Explorer-terrains.dc.html" class="mu-btn mu-btn--secondary mu-btn--l mu-btn--block"><span class="mu-btn__content"><x-import component-from-global-scope="MatchUp.Icon" name="sport-court" size="{{i20}}"></x-import><span class="mu-btn__label label-l">Réserver un terrain</span></span></a>
</div>
<p class="caption" style="margin: 16px 0 0 0; text-align: center; color: var(--text-secondary)">12 parties ouvertes cette semaine à moins de 5 km</p>
</div>
<a href="EXP-03-Explorer-terrains.dc.html" aria-label="Réserver un terrain" style="position: absolute; left: 338px; top: 48px; width: 48px; height: 48px; border-radius: var(--radius-full)"></a>
<a href="MAT-02-Passes.dc.html" aria-label="Passés" style="position: absolute; left: 136px; top: 100px; width: 118px; height: 48px"></a>
<a href="MAT-03-Annules.dc.html" aria-label="Annulés" style="position: absolute; left: 256px; top: 100px; width: 118px; height: 48px"></a>
<x-import component-from-global-scope="MatchUp.TabBar" items="{{tabBar}}" value="matchs" safe-area="{{sa}}" fab="{{yes}}" dc-props="{{tabStyle}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, no: false, i16: 16, i20: 20, i24: 24, inset: 44, sa: 34,
      barActions: [{ icon: 'calendar-plus', label: 'Réserver un terrain' }],
      tabs: [
        { value: 'avenir', label: 'À venir', panelId: 'mat-panel-avenir' },
        { value: 'passes', label: 'Passés' },
        { value: 'annules', label: 'Annulés' }
      ],
      tabBar: [
        { value: 'accueil', label: 'Accueil', icon: 'house', href: 'HOM-01-Accueil.dc.html' },
        { value: 'explorer', label: 'Explorer', icon: 'compass', href: 'EXP-01-Explorer-parties.dc.html' },
        { value: 'matchs', label: 'Mes matchs', icon: 'calendar-check', href: 'MAT-01-A-venir.dc.html' },
        { value: 'entrainement', label: 'Entraînement', icon: 'barbell' },
        { value: 'communaute', label: 'Communauté', icon: 'users-three' }
      ],
      tabStyle: { style: { position: 'absolute', left: 0, right: 0, bottom: 0 } }
    };
  }
}
</script>
</body>
</html>
