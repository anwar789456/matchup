<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler un commentaire</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/* frm:thread — shared by FRM-03, FRM-04, FRM-05 */
body{margin:0}
a{color:var(--link)}
.frm-head{flex:none; display:flex; align-items:center; gap:4px; min-height:48px; padding:52px 8px 8px 8px; background:var(--surface)}
.frm-post{display:flex; flex-direction:column; gap:14px; padding:8px 16px 16px 16px; background:var(--surface)}
.frm-eyebrow{display:flex; align-items:center; gap:8px; color:var(--text-secondary)}
.frm-who{display:flex; align-items:center; gap:10px}
.frm-who__txt{flex:1; min-width:0; display:flex; flex-direction:column}
.frm-tags{display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--text-secondary)}
.frm-acts{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--border)}
.frm-vote{display:inline-flex; align-items:center; gap:2px; padding:2px; border-radius:var(--radius-full); background:var(--surface-muted); box-shadow:inset 0 0 0 1px var(--border)}
.frm-vote__n{min-width:24px; text-align:center}
.frm-best{display:flex; flex-direction:column; gap:12px; margin:0 16px; padding:14px 16px 12px 16px; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--elevation-1), inset 0 0 0 1.5px var(--success)}
.frm-best__flag{display:flex; align-items:center; gap:6px; color:var(--success-text)}
.frm-sec{display:flex; flex-direction:column; gap:16px; padding:16px; background:var(--surface)}
.frm-sec__head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.frm-c{display:flex; gap:10px}
.frm-c__body{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.frm-c__meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; color:var(--text-secondary)}
.frm-c__text{margin:0}
.frm-c__acts{display:flex; align-items:center; gap:2px; margin-inline-start:-8px; color:var(--text-secondary)}
.frm-mini{appearance:none; border:0; margin:0; background:none; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:4px; min-height:36px; padding:0 8px; border-radius:var(--radius-full); color:var(--text-secondary); text-decoration:none}
.frm-mini:hover{background:var(--surface-muted); color:var(--text)}
.frm-mini:focus-visible{outline:none; box-shadow:var(--focus-ring)}
.frm-mini.is-on{color:var(--text)}
.frm-mini.is-on .frm-mini__ico{background:var(--accent); color:var(--on-accent)}
.frm-mini__ico{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:var(--radius-full)}
.frm-replies{display:flex; flex-direction:column; gap:16px; margin-inline-start:19px; padding-inline-start:29px; border-inline-start:2px solid var(--border)}
.frm-op{display:inline-flex; align-items:center; padding:0 6px; border-radius:var(--radius-xs); background:var(--surface-muted); box-shadow:inset 0 0 0 1px var(--border); color:var(--text)}
.frm-masked{display:flex; align-items:flex-start; gap:10px; padding:12px; border-radius:var(--radius-md); border:1px dashed var(--border-strong); background:var(--surface-muted)}
.frm-masked__ico{flex:none; width:32px; height:32px; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); color:var(--text-secondary)}
.frm-composer{position:absolute; left:0; right:0; bottom:0; z-index:var(--z-sticky); display:flex; align-items:center; gap:10px; padding:10px 12px 34px 16px; background:var(--surface); box-shadow:var(--elevation-2-up)}
.frm-composer__field{flex:1; min-width:0; display:flex; align-items:center; min-height:44px; padding:0 16px; border-radius:var(--radius-full); background:var(--surface-muted); box-shadow:inset 0 0 0 1px var(--border); color:var(--text-secondary); text-decoration:none}
.frm-hot{position:absolute; display:block; border-radius:var(--radius-full); z-index:3}
.frm-hot:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.frm-target{margin:0 -16px; padding:12px 16px; background:var(--warning-soft); box-shadow:inset 3px 0 0 var(--warning)}
/* /frm:thread */
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; gap: 8px; background: var(--bg); color: var(--text); font-family: var(--font-sans)">
<div aria-hidden="true" style="display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--surface)">
<div class="frm-head">
<span class="mu-iconbtn mu-iconbtn--l mu-iconbtn--ghost" style="color: var(--text)"><x-import component-from-global-scope="MatchUp.Icon" name="arrow-left" size="{{i24}}"></x-import></span>
<span class="label-l" style="flex: 1; min-width: 0">Crampons pour synthétique ?</span>
</div>
<div class="frm-sec" style="padding-top: 8px">
<div class="frm-replies" style="margin-top: -4px">
<div class="frm-masked">
<span class="frm-masked__ico"><x-import component-from-global-scope="MatchUp.Icon" name="eye-slash" size="{{i16}}"></x-import></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span class="label">Masqué par la modération · en cours de vérification</span>
</div>
</div>
</div>
<div class="frm-c frm-target">
<x-import component-from-global-scope="MatchUp.Avatar" name="Bons Plans" size="m"></x-import>
<div class="frm-c__body">
<div class="frm-c__meta caption"><span class="label-s" style="color: var(--text)">Bons Plans Sport TN</span><span>· il y a 3 h</span></div>
<p class="frm-c__text body">Vends crampons pas cher, toutes marques, livraison partout en Tunisie. Écris-moi en privé !!</p>
</div>
</div>
</div>
</div>

<x-import component-from-global-scope="MatchUp.BottomSheet" inline="{{yes}}" open="{{yes}}" height="auto" title="Signaler ce commentaire" safe-area="{{safe}}" footer="{{footer}}" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<x-import component-from-global-scope="MatchUp.Radio.Group" aria-label="Motif du signalement" value="{{reason}}" on-change="{{setReason}}">
<x-import component-from-global-scope="MatchUp.Radio" value="spam" label="Spam ou publicité"></x-import>
<x-import component-from-global-scope="MatchUp.Radio" value="insult" label="Insulte ou harcèlement"></x-import>
<x-import component-from-global-scope="MatchUp.Radio" value="unsafe" label="Contenu choquant ou dangereux"></x-import>
<x-import component-from-global-scope="MatchUp.Radio" value="fake" label="Fausse information"></x-import>
<x-import component-from-global-scope="MatchUp.Radio" value="other" label="Autre chose"></x-import>
</x-import>
<div style="padding: 4px 12px; border-radius: var(--radius-md); background: var(--surface-muted)">
<x-import component-from-global-scope="MatchUp.Checkbox" checked="{{mute}}" on-change="{{setMute}}" label="Ne plus voir les messages de Bons Plans Sport TN"></x-import>
</div>
<p class="caption" style="margin: 0; display: flex; gap: 6px; color: var(--text-secondary)"><x-import component-from-global-scope="MatchUp.Icon" name="shield-check" size="{{i16}}"></x-import><span>Signalement anonyme · vérifié par un modérateur sous 24 h.</span></p>
</div>
</x-import>
<a href="FRM-04-Discussion.dc.html" aria-label="Fermer et revenir à la discussion" style="position: absolute; left: 0; right: 0; top: 0; height: 100px; z-index: 401"></a>
<a href="FRM-04-Discussion.dc.html" aria-label="Fermer" style="position: absolute; left: 340px; top: 316px; width: 44px; height: 44px; border-radius: var(--radius-full); z-index: 401"></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { reason: 'spam', mute: true };
  renderVals() {
    const h = React.createElement, B = MatchUp.Button;
    return {
      yes: true, no: false, noop: () => {}, i16: 16, i20: 20, i24: 24,
      safe: { bottom: 34 },
      reason: this.state.reason, setReason: (v) => this.setState({ reason: v }),
      mute: this.state.mute, setMute: (v) => this.setState({ mute: v }),
      footer: h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 12 } },
        h(B, { variant: 'secondary', size: 'xl', fullWidth: true, href: 'FRM-04-Discussion.dc.html' }, 'Annuler'),
        h(B, { size: 'xl', fullWidth: true, leadingIcon: 'flag', href: 'FRM-04-Discussion.dc.html' }, 'Signaler'))
    };
  }
}
</script>
</body>
</html>
