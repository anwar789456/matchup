body{margin:0}
a{color:var(--link)}
.tb-muted{color:var(--text-secondary)}
.tb-m0{margin:0}
.tb-hot{position:absolute; display:block; border-radius:var(--radius-sm)}
.tb-hot:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.tb-live{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-md); background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--live), var(--elevation-1)}
.tb-dot{flex:none; width:8px; height:8px; border-radius:var(--radius-full); background:var(--live); box-shadow:0 0 0 4px color-mix(in srgb, var(--live) 22%, transparent)}
@keyframes tb-pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.tb-dot{animation:tb-pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.tb-dot{animation:none}}
.tb-map{position:relative; width:326px; height:112px; margin:0 auto}
.tb-m{position:absolute; width:60px; height:20px; box-sizing:border-box; border-radius:4px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border-strong); display:flex; flex-direction:column; justify-content:center; gap:3px; padding:0 6px}
.tb-m i{display:block; height:3px; border-radius:2px; background:var(--border-strong)}
.tb-m i + i{width:70%}
.tb-m.is-you{background:var(--accent); box-shadow:none}
.tb-m.is-you i{background:var(--on-accent); opacity:0.55}
.tb-m.is-live{box-shadow:0 0 0 2px var(--live)}
.tb-m.is-tbd{background:transparent; box-shadow:none; border:1.5px dashed var(--border-strong)}
.tb-w{position:absolute; box-sizing:border-box; border:1.5px solid var(--border-strong); border-left:0; border-radius:0 6px 6px 0}
.tb-l{position:absolute; height:0; border-top:1.5px solid var(--border-strong)}
.tb-frame{position:absolute; left:100px; top:-6px; width:228px; height:124px; box-sizing:border-box; border:2px solid var(--text); border-radius:var(--radius-sm); background:color-mix(in srgb, var(--text) 4%, transparent)}
.tb-frame span{position:absolute; top:-11px; right:10px; padding:1px 6px; border-radius:var(--radius-full); background:var(--text); color:var(--bg)}
.tb-next{display:flex; align-items:center; gap:12px; padding:14px 16px}
.tb-clip{height:332px; overflow:hidden}
