<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dur: '7j' }; }
  renderVals() {
    const dur = this.state.dur;
    const opts = [
      { value: '24h', label: '24 h', until: 'sam. 17 oct. · 18h00', cta: 'Suspendre 24 h' },
      { value: '7j', label: '7 jours', until: 'ven. 23 oct. · 18h00', cta: 'Suspendre 7 jours' },
      { value: '30j', label: '30 jours', until: 'dim. 15 nov. · 18h00', cta: 'Suspendre 30 jours' },
      { value: 'ban', label: 'Définitif', until: null, cta: 'Bannir définitivement' }
    ];
    const cur = opts.find((o) => o.value === dur) || opts[1];
    const freed = 'Ses 2 parties à venir sont libérées et 30 DT remboursés sur son solde.';
    return {
      yes: true, nul: null, i16: 16, i20: 20, i24: 24, lv35: 3.5, two: 2, max: 280,
      noop: () => {},
      safeBottom: { bottom: 34 },
      durations: opts.map((o) => ({ label: o.label, on: o.value === dur, pick: () => this.setState({ dur: o.value }) })),
      consequence: cur.until
        ? 'Jusqu’au ' + cur.until + ' : ni partie, ni réservation. ' + freed
        : 'Compte fermé, sans réinscription possible avec ce numéro. ' + freed,
      cta: cur.cta,
      dTitle: cur.until ? 'Suspendre Omar D. ?' : 'Bannir Omar D. ?',
      dDesc: cur.until ? 'Il est prévenu par email avec ta raison. Tu peux lever la suspension à tout moment.' : 'Il est prévenu par email avec ta raison. Seul un admin pourra rouvrir le compte, après un recours.',
      reasons: [
        { value: 'noshow', label: 'No-shows répétés' },
        { value: 'agressif', label: 'Comportement agressif' },
        { value: 'spam', label: 'Spam ou publicité' },
        { value: 'fraude', label: 'Fraude au paiement' },
        { value: 'autre', label: 'Autre raison' }
      ]
    };
  }
}
</script>
