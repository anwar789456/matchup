<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Erreur serveur</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}
.sta-err{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:0 24px}
.sta-err__art{position:relative; width:96px; height:96px; margin-bottom:12px}
.sta-err__disc{position:absolute; inset:0; border-radius:var(--radius-full); background:var(--error-soft); color:var(--error-text); display:flex; align-items:center; justify-content:center}
.sta-err__badge{position:absolute; right:-4px; bottom:2px; width:36px; height:36px; border-radius:var(--radius-full); background:var(--surface); box-shadow:0 0 0 3px var(--bg), var(--elevation-1); color:var(--text-secondary); display:flex; align-items:center; justify-content:center}
.sta-safe{display:flex; flex-direction:column; gap:10px; margin:0; padding:14px 16px; list-style:none; border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--elevation-1), inset 0 0 0 1px var(--border); text-align:start}
.sta-safe li{display:flex; align-items:flex-start; gap:10px}
.sta-safe li > span:first-child{flex:none; display:flex; color:var(--success-text); margin-top:2px}
.sta-hot{position:absolute; display:block; border-radius:var(--radius-full)}
.sta-hot:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-sans)">
<x-import component-from-global-scope="MatchUp.TopAppBar" variant="large" title="Mes matchs" collapsed="{{yes}}" scrolled="{{no}}" inset="{{inset}}" actions="{{barActions}}"></x-import>
<div style="padding: 0 16px; background: var(--bg)">
<x-import component-from-global-scope="MatchUp.Tabs" label="Mes matchs" items="{{tabs}}" value="avenir" full-width="{{yes}}" id-base="sta-tab"></x-import>
</div>

<div id="sta-panel" role="tabpanel" aria-labelledby="sta-tab-avenir" style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 8px 16px 132px 16px">
<div class="sta-err" role="alert">
<div class="sta-err__art" aria-hidden="true">
<span class="sta-err__disc"><x-import component-from-global-scope="MatchUp.Icon" name="calendar-x" size="{{i40}}"></x-import></span>
<span class="sta-err__badge"><x-import component-from-global-scope="MatchUp.Icon" name="warning-circle" weight="fill" size="{{i20}}"></x-import></span>
</div>
<h2 class="h3" style="margin: 0">Tes matchs ne se chargent pas</h2>
<p class="body" style="margin: 0; max-width: 320px; color: var(--text-secondary)">Nos serveurs ont un souci, ce n’est pas ta connexion. Réessaie dans un instant.</p>
</div>

<ul class="sta-safe" aria-label="Ce qui ne change pas">
<li><span><x-import component-from-global-scope="MatchUp.Icon" name="check-circle" weight="fill" size="{{i16}}"></x-import></span><span class="body">Tes réservations et ta place du <span class="label">dim. 18 oct.</span> sont toujours là.</span></li>
<li><span><x-import component-from-global-scope="MatchUp.Icon" name="check-circle" weight="fill" size="{{i16}}"></x-import></span><span class="body">Aucun paiement n’a été lancé ni débité.</span></li>
</ul>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<a href="MAT-01-A-venir.dc.html" class="mu-btn mu-btn--primary mu-btn--l mu-btn--block"><span class="mu-btn__content"><x-import component-from-global-scope="MatchUp.Icon" name="arrow-clockwise" size="{{i20}}"></x-import><span class="mu-btn__label label-l">Réessayer</span></span></a>
<p class="caption" style="margin: 0; color: var(--text-secondary)">Erreur 503 · réf. <span class="num-xs" style="color: var(--text)">MU-7F3A-2C</span> · notre équipe est prévenue</p>
</div>
</div>

<a href="EXP-03-Explorer-terrains.dc.html" class="sta-hot" aria-label="Réserver un terrain" style="left: 338px; top: 48px; width: 48px; height: 48px"></a>
<a href="MAT-02-Passes.dc.html" aria-label="Passés" style="position: absolute; left: 136px; top: 100px; width: 118px; height: 48px"></a>
<a href="MAT-03-Annules.dc.html" aria-label="Annulés" style="position: absolute; left: 256px; top: 100px; width: 118px; height: 48px"></a>
<x-import component-from-global-scope="MatchUp.TabBar" items="{{tabBar}}" value="matchs" safe-area="{{sa}}" fab="{{yes}}" dc-props="{{tabStyle}}"></x-import>
<a href="AI-01-Assistant.dc.html" aria-label="Ouvrir l’assistant MatchUp" style="z-index: calc(var(--z-sticky) + 1); position: absolute; right: 16px; bottom: 114px; width: 56px; height: 56px; border-radius: var(--radius-full)"></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, no: false, i16: 16, i20: 20, i24: 24, i40: 40, inset: 44, sa: 34,
      barActions: [{ icon: 'calendar-plus', label: 'Réserver un terrain' }],
      tabs: [
        { value: 'avenir', label: 'À venir', panelId: 'sta-panel' },
        { value: 'passes', label: 'Passés' },
        { value: 'annules', label: 'Annulés' }
      ],
      tabBar: [
        { value: 'accueil', label: 'Accueil', icon: 'house', href: 'HOM-01-Accueil.dc.html' },
        { value: 'explorer', label: 'Explorer', icon: 'compass', href: 'EXP-01-Explorer-parties.dc.html' },
        { value: 'matchs', label: 'Mes matchs', icon: 'calendar-check', badge: 1, badgeLabel: '1 invitation', href: 'MAT-01-A-venir.dc.html' },
        { value: 'entrainement', label: 'Entraînement', icon: 'barbell', href: 'ENT-01-Mon-entrainement.dc.html' },
        { value: 'communaute', label: 'Communauté', icon: 'users-three', href: 'FRM-01-Communaute.dc.html' }
      ],
      tabStyle: { style: { position: 'absolute', left: 0, right: 0, bottom: 0 } }
    };
  }
}
</script>
</body>
</html>
