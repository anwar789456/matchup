<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Localisation refusée</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} a{color:var(--link)}</style></helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-sans)">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 52px 8px 0 8px">
<a href="PLY-06-Localisation.dc.html" class="mu-iconbtn mu-iconbtn--l mu-iconbtn--ghost" aria-label="Retour" style="color: var(--text)"><x-import component-from-global-scope="MatchUp.Icon" name="arrow-left" size="{{i24}}"></x-import></a>
<a href="PLY-09-Notifications.dc.html" class="mu-btn mu-btn--tertiary mu-btn--m"><span class="mu-btn__content"><span class="mu-btn__label label">Passer</span></span></a>
</div>
<div style="padding: 4px 16px 0 16px">
<x-import component-from-global-scope="MatchUp.StepIndicator" step="{{step}}" total="{{total}}" title="Localisation"></x-import>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 20px; padding: 24px 16px 24px 16px">
<div style="display: flex; flex-direction: column; gap: 12px">
<x-import component-from-global-scope="MatchUp.Banner" tone="warning" icon="map-pin-area" title="Localisation désactivée">Choisis tes zones à la main, ou active ta position dans Réglages.</x-import>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 14px 16px; border-radius: var(--radius-md); background: var(--surface-muted)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 class="label" style="margin: 0">Pour l’activer</h2>
<button type="button" class="mu-btn mu-btn--link mu-btn--s"><span class="mu-btn__content"><span class="mu-btn__label label">Ouvrir Réglages</span><x-import component-from-global-scope="MatchUp.Icon" name="arrow-square-out" size="{{i16}}"></x-import></span></button>
</div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px">
<li style="display: flex; align-items: center; gap: 6px"><span class="num-xs" style="flex: none; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); display: flex; align-items: center; justify-content: center">1</span><span class="label">Réglages</span><span aria-hidden="true" style="display: flex; color: var(--text-secondary)"><x-import component-from-global-scope="MatchUp.Icon" name="caret-right" size="{{i16}}"></x-import></span></li>
<li style="display: flex; align-items: center; gap: 6px"><span class="num-xs" style="flex: none; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); display: flex; align-items: center; justify-content: center">2</span><span class="label">MatchUp</span><span aria-hidden="true" style="display: flex; color: var(--text-secondary)"><x-import component-from-global-scope="MatchUp.Icon" name="caret-right" size="{{i16}}"></x-import></span></li>
<li style="display: flex; align-items: center; gap: 6px"><span class="num-xs" style="flex: none; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); display: flex; align-items: center; justify-content: center">3</span><span class="label">Position</span><span aria-hidden="true" style="display: flex; color: var(--text-secondary)"><x-import component-from-global-scope="MatchUp.Icon" name="caret-right" size="{{i16}}"></x-import></span></li>
<li style="display: flex; align-items: center; gap: 6px"><span class="num-xs" style="flex: none; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); display: flex; align-items: center; justify-content: center">4</span><span class="label">« Lorsque l’app est active »</span></li>
</ol>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="h2" style="margin: 0">Choisis tes zones de jeu</h1>
<p class="body" style="margin: 0; color: var(--text-secondary)">On te proposera des parties dans ces quartiers.</p>
</div>
<x-import component-from-global-scope="MatchUp.SearchField" label="Ajouter une zone" placeholder="Ajouter une zone : quartier, ville…"></x-import>
<div role="group" aria-label="Zones proposées" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{zones}}" as="z">
<x-import component-from-global-scope="MatchUp.Chip" kind="filter" selected="{{z.on}}" on-click="{{z.toggle}}">{{z.name}}</x-import>
</sc-for>
</div>
</section>
</div>
<div style="padding: 12px 16px 34px 16px; background: var(--surface); box-shadow: var(--elevation-2-up); display: flex; flex-direction: column; gap: 12px">
<a href="PLY-09-Notifications.dc.html" class="mu-btn mu-btn--primary mu-btn--xl mu-btn--block"><span class="mu-btn__content"><span class="mu-btn__label label-l">Continuer avec mes zones</span></span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { on: { 'La Marsa': true, 'Lac 2': true } };
  renderVals() {
    const ALL = ['La Marsa', 'Lac 2', 'Ennasr', 'Menzah 6', 'Ariana', 'Carthage', 'Gammarth', 'Sidi Bou Saïd'];
    const on = this.state.on;
    return {
      i16: 16, i20: 20, i24: 24, step: 5, total: 8,
      zones: ALL.map((name) => ({ name, on: !!on[name], toggle: () => this.setState({ on: { ...this.state.on, [name]: !this.state.on[name] } }) }))
    };
  }
}
</script>
</body>
</html>
