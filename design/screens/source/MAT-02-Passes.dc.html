<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes matchs · Passés</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-sans)">
<x-import component-from-global-scope="MatchUp.TopAppBar" variant="large" title="Mes matchs" collapsed="{{yes}}" scrolled="{{no}}" inset="{{inset}}" actions="{{barActions}}"></x-import>
<div style="padding: 0 16px; background: var(--bg)">
<x-import component-from-global-scope="MatchUp.Tabs" label="Mes matchs" items="{{tabs}}" value="passes" full-width="{{yes}}" id-base="mat-tab"></x-import>
</div>
<div id="mat-panel-passes" role="tabpanel" aria-labelledby="mat-tab-passes" style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 20px; padding: 16px 16px 120px 16px">

<section aria-labelledby="mat-rate-t" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="mat-rate-t" class="overline" style="margin: 0; color: var(--text-secondary)">À évaluer</h2>
<x-import component-from-global-scope="MatchUp.MatchCard" dc-props="{{padel}}"></x-import>
<div class="mu-card" style="display: flex; flex-direction: column; gap: 12px; padding: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<x-import component-from-global-scope="MatchUp.AvatarStack" people="{{mates}}" size="s" label="Mariem K., Ines M. et Nour A."></x-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span class="label-l">Évalue tes coéquipiers</span>
<span class="caption" style="color: var(--text-secondary)">Mariem, Ines et Nour · 1 min</span>
</div>
</div>
<a href="MAT-08-Evaluer-les-joueurs.dc.html" class="mu-btn mu-btn--primary mu-btn--m mu-btn--block"><span class="mu-btn__content"><x-import component-from-global-scope="MatchUp.Icon" name="star" size="{{i20}}"></x-import><span class="mu-btn__label label">Évaluer les joueurs</span></span></a>
</div>
</section>

<section aria-labelledby="mat-earlier-t" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="mat-earlier-t" class="overline" style="margin: 0; color: var(--text-secondary)">Plus tôt</h2>
<span class="caption" style="display: flex; align-items: center; gap: 4px; color: var(--success-text)"><x-import component-from-global-scope="MatchUp.Icon" name="check-circle" weight="fill" size="{{i16}}"></x-import>Évalués</span>
</div>
<x-import component-from-global-scope="MatchUp.MatchCard" dc-props="{{foot}}"></x-import>
<x-import component-from-global-scope="MatchUp.MatchCard" dc-props="{{basket}}"></x-import>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 8px">
<p class="caption" style="margin: 0; color: var(--text-secondary)">3 matchs depuis septembre · 2 victoires</p>
<a href="PRF-01-Mon-profil.dc.html" class="mu-btn mu-btn--tertiary mu-btn--s"><span class="mu-btn__content"><span class="mu-btn__label label">Voir toutes mes stats</span></span></a>
</div>
</section>

</div>
<a href="EXP-03-Explorer-terrains.dc.html" aria-label="Réserver un terrain" style="position: absolute; left: 338px; top: 48px; width: 48px; height: 48px; border-radius: var(--radius-full)"></a>
<a href="MAT-01-A-venir.dc.html" aria-label="À venir" style="position: absolute; left: 16px; top: 100px; width: 118px; height: 48px"></a>
<a href="MAT-03-Annules.dc.html" aria-label="Annulés" style="position: absolute; left: 256px; top: 100px; width: 118px; height: 48px"></a>
<x-import component-from-global-scope="MatchUp.TabBar" items="{{tabBar}}" value="matchs" safe-area="{{sa}}" fab="{{yes}}" dc-props="{{tabStyle}}"></x-import>
</div>
</x-dc>
