<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tes zones</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} a{color:var(--link)}</style></helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-sans)">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 52px 8px 0 8px">
<a href="PLY-06-Localisation.dc.html" class="mu-iconbtn mu-iconbtn--l mu-iconbtn--ghost" aria-label="Retour" style="color: var(--text)"><x-import component-from-global-scope="MatchUp.Icon" name="arrow-left" size="{{i24}}"></x-import></a>
<a href="PLY-09-Notifications.dc.html" class="mu-btn mu-btn--tertiary mu-btn--m"><span class="mu-btn__content"><span class="mu-btn__label label">Passer</span></span></a>
</div>
<div style="padding: 4px 16px 0 16px">
<x-import component-from-global-scope="MatchUp.StepIndicator" step="{{step}}" total="{{total}}" title="Localisation"></x-import>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 20px; padding: 24px 16px 24px 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="h1" style="margin: 0">Tes zones de jeu</h1>
<p class="body-l" style="margin: 0; color: var(--text-secondary)">Ajoute les quartiers où tu joues souvent, même loin de chez toi.</p>
</div>
<div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--success-soft)">
<span style="flex: none; display: flex; color: var(--success-text)"><x-import component-from-global-scope="MatchUp.Icon" name="navigation-arrow" size="{{i20}}"></x-import></span>
<span class="body" style="flex: 1; min-width: 0; color: var(--text)"><span class="label">Position activée</span> · La Marsa</span>
<x-import component-from-global-scope="MatchUp.Icon" name="check-circle" size="{{i20}}" style="color: var(--success-text)"></x-import>
</div>
<x-import component-from-global-scope="MatchUp.SearchField" label="Ajouter une zone" placeholder="Ajouter une zone : quartier, ville…"></x-import>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 class="label" style="margin: 0">Tes zones</h2>
<span class="caption" style="color: var(--text-secondary)">{{zoneCount}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{zones}}" as="z">
<x-import component-from-global-scope="MatchUp.Chip" kind="input" icon="map-pin" on-remove="{{z.remove}}" remove-label="Retirer {{z.name}}">{{z.name}}</x-import>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 class="label" style="margin: 0">Suggestions autour de toi</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{suggestions}}" as="sug">
<x-import component-from-global-scope="MatchUp.Chip" kind="filter" icon="plus" on-click="{{sug.add}}">{{sug.name}}</x-import>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 class="label" style="margin: 0">Distance maximale</h2>
<span class="label" style="color: var(--text-secondary)">{{radiusLabel}}</span>
</div>
<x-import component-from-global-scope="MatchUp.SegmentedControl" label="Distance maximale" full-width="{{yes}}" options="{{radii}}" value="{{radius}}" on-change="{{setRadius}}"></x-import>
</section>
</div>
<div style="padding: 12px 16px 34px 16px; background: var(--surface); box-shadow: var(--elevation-2-up); display: flex; flex-direction: column; gap: 12px">
<a href="PLY-09-Notifications.dc.html" class="mu-btn mu-btn--primary mu-btn--xl mu-btn--block"><span class="mu-btn__content"><span class="mu-btn__label label-l">Continuer</span></span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { zones: ['La Marsa', 'Lac 2'], radius: '10' };
  renderVals() {
    const ALL = ['La Marsa', 'Lac 2', 'Ennasr', 'Menzah 6', 'Ariana', 'Carthage', 'Gammarth', 'Sidi Bou Saïd'];
    const zones = this.state.zones;
    const n = zones.length;
    return {
      yes: true, i20: 20, i24: 24, step: 5, total: 8,
      zones: zones.map((name) => ({ name, remove: () => this.setState({ zones: this.state.zones.filter((x) => x !== name) }) })),
      suggestions: ALL.filter((x) => !zones.includes(x)).map((name) => ({ name, add: () => this.setState({ zones: [...this.state.zones, name] }) })),
      zoneCount: n === 0 ? 'Aucune zone' : n === 1 ? '1 zone' : n + ' zones',
      radii: [{ value: '5', label: '5 km' }, { value: '10', label: '10 km' }, { value: '20', label: '20 km' }, { value: '30', label: '30 km' }],
      radius: this.state.radius,
      radiusLabel: 'Jusqu’à ' + this.state.radius + ' km',
      setRadius: (v) => this.setState({ radius: v })
    };
  }
}
</script>
</body>
</html>
