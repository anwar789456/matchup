<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Langue et thème</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/* set:shared — identical in SET-01…07 */
body{margin:0}
a{color:var(--link)}
.set-body{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:var(--space-5); padding:var(--space-2) var(--space-4) 34px var(--space-4); box-sizing:border-box}
.set-section{display:flex; flex-direction:column; gap:var(--space-2); margin:0}
.set-section__title{margin:0; padding-inline:var(--space-4); color:var(--text-secondary)}
.set-group{margin:0; padding:0; list-style:none; background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--elevation-1); overflow:hidden}
.set-group > li{position:relative}
.set-group > li + li::before{content:""; position:absolute; top:0; inset-inline-start:64px; inset-inline-end:0; height:1px; background:var(--border); z-index:1}
.set-row{position:relative; display:flex; align-items:center; gap:var(--space-3); min-height:56px; padding:var(--space-2) var(--space-4); box-sizing:border-box; color:var(--text); text-decoration:none; -webkit-tap-highlight-color:transparent; transition:background var(--duration-fast) var(--ease-enter)}
a.set-row[href]{cursor:pointer}
a.set-row[href]:hover{background:var(--surface-muted)}
a.set-row[href]:active{background:var(--surface-muted)}
a.set-row:focus-visible{outline:none; box-shadow:inset 0 0 0 2px var(--focus)}
.set-row__icon{flex:none; width:36px; height:36px; border-radius:var(--radius-sm); background:var(--surface-muted); color:var(--text); display:grid; place-items:center}
.set-row__text{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px}
.set-row__desc{color:var(--text-secondary)}
.set-row__value{flex:none; max-width:46%; color:var(--text-secondary); text-align:end; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.set-row__chev{flex:none; display:flex; color:var(--text-secondary); margin-inline-end:calc(-1 * var(--space-1))}
.set-row--danger{color:var(--error-text)}
.set-row--danger .set-row__icon{background:var(--error-soft); color:var(--error-text)}
.set-row--control > .mu-switch{flex:1 1 auto; min-width:0}
.set-card{background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--elevation-1); padding:var(--space-4); display:flex; flex-direction:column; gap:var(--space-5)}
.set-note{margin:0; padding-inline:var(--space-4); color:var(--text-secondary)}
.set-body--bar{padding-bottom:var(--space-6)}
.set-bar{position:relative; z-index:2; display:flex; flex-direction:column; gap:var(--space-3); padding:12px var(--space-4) 34px var(--space-4); background:var(--surface); box-shadow:var(--elevation-2-up)}
.set-back{position:absolute; left:4px; top:48px; width:48px; height:48px; border-radius:var(--radius-full); z-index:2}
.set-back:focus-visible{outline:none; box-shadow:var(--focus-ring)}
/* /set:shared */
.set-radios .mu-sel-group__items{gap:0}
.set-radios .mu-radio{display:flex; align-items:center; min-height:56px; padding:var(--space-2) var(--space-4); box-sizing:border-box}
.set-radios .mu-sel-group__items > :not(:first-child) > .mu-radio::before, .set-radios .mu-sel-group__items > .mu-radio:not(:first-child)::before{content:""; position:absolute; top:0; inset-inline-start:48px; inset-inline-end:0; height:1px; background:var(--border)}
.set-radios .mu-radio:hover{background:var(--surface-muted)}
.set-themes{display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--space-3); padding:var(--space-4); background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--elevation-1)}
.set-theme{position:relative; display:flex; flex-direction:column; align-items:center; gap:var(--space-3); cursor:pointer; -webkit-tap-highlight-color:transparent}
.set-theme__preview{position:relative; width:100%; aspect-ratio:3 / 4; border-radius:var(--radius-sm); overflow:hidden; box-shadow:0 0 0 1px var(--border-strong); transition:box-shadow var(--duration-fast) var(--ease-enter)}
.set-theme:hover .set-theme__preview{box-shadow:0 0 0 1px var(--text)}
.set-theme:has(input:checked) .set-theme__preview{box-shadow:0 0 0 2px var(--primary)}
.set-theme:has(input:focus-visible) .set-theme__preview{box-shadow:var(--focus-ring)}
.set-theme__pick{display:flex; align-items:center; gap:var(--space-2)}
.set-theme:has(input:checked) .mu-radio__circle{border:2px solid var(--primary)}
.set-theme:has(input:checked) .mu-radio__circle::after{transform:scale(1)}
.set-mini{position:absolute; inset:0; display:flex; flex-direction:column; gap:5px; padding:10px 8px; background:var(--bg); box-sizing:border-box}
.set-mini--half{clip-path:polygon(100% 0, 100% 100%, 0 100%)}
.set-mini__title{width:52%; height:6px; border-radius:var(--radius-full); background:var(--text); margin-bottom:3px}
.set-mini__card{display:flex; flex-direction:column; gap:5px; padding:6px; border-radius:4px; background:var(--surface); box-shadow:0 0 0 1px var(--border)}
.set-mini__row{display:flex; align-items:center; gap:4px}
.set-mini__dot{flex:none; width:8px; height:8px; border-radius:2px; background:var(--surface-muted); box-shadow:0 0 0 1px var(--border)}
.set-mini__line{flex:1; height:4px; border-radius:var(--radius-full); background:var(--text-secondary); opacity:0.55}
.set-mini__btn{margin-top:auto; height:12px; border-radius:4px; background:var(--primary)}
</style>
</helmet>
<div data-theme="{{themeAttr}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-sans)">
<x-import component-from-global-scope="MatchUp.TopAppBar" title="Langue et thème" on-back="{{noop}}" inset="{{inset}}"></x-import>
<a href="SET-01-Parametres.dc.html" class="set-back" aria-label="Retour aux paramètres"></a>
<div class="set-body">

<section class="set-section" aria-labelledby="set-s-lang">
<h2 id="set-s-lang" class="set-section__title overline">Langue</h2>
<div class="set-group set-radios">
<x-import component-from-global-scope="MatchUp.Radio.Group" aria-labelledby="set-s-lang" name="langue" default-value="fr">
<x-import component-from-global-scope="MatchUp.Radio" value="fr" description="Langue par défaut de MatchUp"><span lang="fr">Français</span></x-import>
<x-import component-from-global-scope="MatchUp.Radio" value="ar" description="Arabe · l’interface passe de droite à gauche"><span lang="ar" dir="rtl" class="ar-label">العربية</span></x-import>
<x-import component-from-global-scope="MatchUp.Radio" value="en" description="Anglais"><span lang="en">English</span></x-import>
</x-import>
</div>
<p class="set-note caption">En arabe, les menus et les flèches s’inversent. Les chiffres, les scores et les cartes restent dans le même sens.</p>
</section>

<section class="set-section" aria-labelledby="set-s-theme">
<h2 id="set-s-theme" class="set-section__title overline">Thème</h2>
<div class="set-themes" role="radiogroup" aria-labelledby="set-s-theme">
<label class="set-theme">
<input type="radio" name="theme" value="clair" class="mu-visually-hidden" onchange="{{pickLight}}">
<span class="set-theme__preview" aria-hidden="true">
<span class="set-mini" data-theme="light"><span class="set-mini__title"></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__btn"></span></span>
</span>
<span class="set-theme__pick"><span class="mu-radio__control"><span class="mu-radio__circle"></span></span><span class="label">Clair</span></span>
</label>
<label class="set-theme">
<input type="radio" name="theme" value="sombre" class="mu-visually-hidden" onchange="{{pickDark}}">
<span class="set-theme__preview" aria-hidden="true">
<span class="set-mini" data-theme="dark"><span class="set-mini__title"></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__btn"></span></span>
</span>
<span class="set-theme__pick"><span class="mu-radio__control"><span class="mu-radio__circle"></span></span><span class="label">Sombre</span></span>
</label>
<label class="set-theme">
<input type="radio" name="theme" value="systeme" class="mu-visually-hidden" checked onchange="{{pickSystem}}">
<span class="set-theme__preview" aria-hidden="true">
<span class="set-mini" data-theme="light"><span class="set-mini__title"></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__btn"></span></span>
<span class="set-mini set-mini--half" data-theme="dark"><span class="set-mini__title"></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__card"><span class="set-mini__row"><span class="set-mini__dot"></span><span class="set-mini__line"></span></span></span><span class="set-mini__btn"></span></span>
</span>
<span class="set-theme__pick"><span class="mu-radio__control"><span class="mu-radio__circle"></span></span><span class="label">Système</span></span>
</label>
</div>
<p class="set-note caption">Système suit le réglage de ton téléphone. Sombre, c’est « Night match » : pensé pour les matchs du soir.</p>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { theme: '' };
  renderVals() {
    return {
      yes: true, i20: 20, i24: 24, inset: 44, noop: () => {},
      themeAttr: this.state.theme,
      pickLight: () => this.setState({ theme: 'light' }),
      pickDark: () => this.setState({ theme: 'dark' }),
      pickSystem: () => this.setState({ theme: '' })
    };
  }
}
</script>
</body>
</html>
