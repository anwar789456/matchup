<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tes sports</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}
.ply-sport{transition:box-shadow var(--duration-fast) var(--ease-enter), transform var(--duration-fast) var(--ease-enter)}
.ply-sport:active{transform:scale(var(--scale-press))}
.ply-sport:has(input:checked){box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--primary)}
.ply-sport:has(input:focus-visible){box-shadow:var(--focus-ring)}
.ply-sport__badge{border:2px solid var(--white); color:var(--on-accent); transition:background-color var(--duration-fast) var(--ease-pop), border-color var(--duration-fast) var(--ease-pop)}
.ply-sport__badge svg{opacity:0}
.ply-sport:has(input:checked) .ply-sport__badge{background:var(--accent); border-color:var(--accent)}
.ply-sport:has(input:checked) .ply-sport__badge svg{opacity:1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-sans)">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 52px 8px 0 8px">
<a href="AUTH-11-Choix-du-role.dc.html" class="mu-iconbtn mu-iconbtn--l mu-iconbtn--ghost" aria-label="Retour" style="color: var(--text)"><x-import component-from-global-scope="MatchUp.Icon" name="arrow-left" size="{{i24}}"></x-import></a>
</div>
<div style="padding: 4px 16px 0 16px">
<x-import component-from-global-scope="MatchUp.StepIndicator" step="{{step}}" total="{{total}}" title="Tes sports"></x-import>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px 24px 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="h1" style="margin: 0">Quels sports tu joues ?</h1>
<p class="body-l" style="margin: 0; color: var(--text-secondary)">Choisis-en un ou plusieurs. On te proposera des parties et des joueurs à ton niveau.</p>
</div>
<div role="group" aria-label="Tes sports" style="display: flex; flex-direction: column; gap: 12px">
<label class="ply-sport" style="position: relative; display: block; height: 116px; border-radius: var(--radius-md); overflow: hidden; cursor: pointer">
<input type="checkbox" class="mu-visually-hidden" name="sports" value="football" checked>
<x-import component-from-global-scope="MatchUp.CourtArt" sport="football" variant="photo" dc-props="{{art}}"></x-import>
<span aria-hidden="true" style="position: absolute; inset: 0; background: var(--photo-scrim)"></span>
<span style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 12px; color: var(--white)">
<span style="flex: none; width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--football-soft); color: var(--football-text); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="MatchUp.Icon" name="sport-football" size="{{i24}}"></x-import></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span class="label-l">Football 5</span>
<span class="caption" style="color: var(--ink-100)">5 contre 5 · terrains synthétiques</span>
</span>
</span>
<span class="ply-sport__badge" aria-hidden="true" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; box-sizing: border-box; border-radius: var(--radius-xs); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="MatchUp.Icon" name="check" size="{{i20}}"></x-import></span>
</label>
<label class="ply-sport" style="position: relative; display: block; height: 116px; border-radius: var(--radius-md); overflow: hidden; cursor: pointer">
<input type="checkbox" class="mu-visually-hidden" name="sports" value="padel" checked>
<x-import component-from-global-scope="MatchUp.CourtArt" sport="padel" variant="photo" dc-props="{{art}}"></x-import>
<span aria-hidden="true" style="position: absolute; inset: 0; background: var(--photo-scrim)"></span>
<span style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 12px; color: var(--white)">
<span style="flex: none; width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--padel-soft); color: var(--padel-text); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="MatchUp.Icon" name="sport-padel" size="{{i24}}"></x-import></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span class="label-l">Padel</span>
<span class="caption" style="color: var(--ink-100)">2 contre 2 · courts vitrés</span>
</span>
</span>
<span class="ply-sport__badge" aria-hidden="true" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; box-sizing: border-box; border-radius: var(--radius-xs); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="MatchUp.Icon" name="check" size="{{i20}}"></x-import></span>
</label>
<label class="ply-sport" style="position: relative; display: block; height: 116px; border-radius: var(--radius-md); overflow: hidden; cursor: pointer">
<input type="checkbox" class="mu-visually-hidden" name="sports" value="basketball">
<x-import component-from-global-scope="MatchUp.CourtArt" sport="basketball" variant="photo" dc-props="{{art}}"></x-import>
<span aria-hidden="true" style="position: absolute; inset: 0; background: var(--photo-scrim)"></span>
<span style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 12px; color: var(--white)">
<span style="flex: none; width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--basketball-soft); color: var(--basketball-text); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="MatchUp.Icon" name="sport-basketball" size="{{i24}}"></x-import></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span class="label-l">Basket</span>
<span class="caption" style="color: var(--ink-100)">3 contre 3 · salles et playgrounds</span>
</span>
</span>
<span class="ply-sport__badge" aria-hidden="true" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; box-sizing: border-box; border-radius: var(--radius-xs); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="MatchUp.Icon" name="check" size="{{i20}}"></x-import></span>
</label>
</div>
</div>
<div style="padding: 12px 16px 34px 16px; background: var(--surface); box-shadow: var(--elevation-2-up); display: flex; flex-direction: column; gap: 12px">
<p class="caption" style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text-secondary)"><x-import component-from-global-scope="MatchUp.Icon" name="cloud-check" size="{{i16}}"></x-import>Ta progression est enregistrée, tu peux reprendre plus tard.</p>
<a href="PLY-02-Questionnaire-IA.dc.html" class="mu-btn mu-btn--primary mu-btn--xl mu-btn--block"><span class="mu-btn__content"><span class="mu-btn__label label-l">Continuer</span></span></a>
</div>
</div>
</x-dc>
