<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Caméra refusée</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}
.cam-head{display:flex; align-items:center; gap:12px; padding:52px 12px 12px 16px}
.cam-view{position:relative; height:268px; border-radius:var(--radius-lg); overflow:hidden; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:0 48px; box-sizing:border-box}
.cam-corner{position:absolute; width:28px; height:28px; border-color:var(--border-strong); border-style:solid; border-width:0}
.cam-ico{position:relative; width:64px; height:64px; border-radius:var(--radius-full); background:var(--surface-elevated); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; margin-bottom:4px}
.cam-ico__x{position:absolute; right:-4px; bottom:-2px; width:26px; height:26px; border-radius:var(--radius-full); background:var(--error); color:var(--white); box-shadow:0 0 0 3px var(--bg); display:flex; align-items:center; justify-content:center}
.cam-steps{margin:0; padding:0; list-style:none; display:flex; flex-direction:column}
.cam-steps li{display:flex; align-items:center; gap:12px; min-height:44px}
.cam-steps li + li{border-top:1px solid var(--border)}
.cam-n{flex:none; width:24px; height:24px; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border-strong)}
.cam-tog{flex:none; position:relative; width:36px; height:20px; border-radius:var(--radius-full); background:var(--success)}
.cam-tog span{position:absolute; right:2px; top:2px; width:16px; height:16px; border-radius:var(--radius-full); background:var(--white)}
.cam-hot{position:absolute; display:block; border-radius:var(--radius-full)}
.cam-hot:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-sans)">
<header class="cam-head">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span class="caption" style="color: var(--text-secondary)">Espace propriétaire · Arena Five</span>
<h1 class="h2" style="margin: 0">Check-in</h1>
</div>
<x-import component-from-global-scope="MatchUp.Avatar" name="Skander T." size="m"></x-import>
<a href="PRF-06-Changer-de-role.dc.html" class="cam-hot" aria-label="Changer de rôle" style="left: 330px; top: 56px; width: 48px; height: 48px"></a>
</header>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 0 16px">
<div class="cam-view" data-theme="dark" role="img" aria-label="Scanner indisponible : MatchUp n’a pas accès à la caméra">
<span class="cam-corner" style="left: 20px; top: 20px; border-left-width: 3px; border-top-width: 3px; border-top-left-radius: 10px"></span>
<span class="cam-corner" style="right: 20px; top: 20px; border-right-width: 3px; border-top-width: 3px; border-top-right-radius: 10px"></span>
<span class="cam-corner" style="left: 20px; bottom: 20px; border-left-width: 3px; border-bottom-width: 3px; border-bottom-left-radius: 10px"></span>
<span class="cam-corner" style="right: 20px; bottom: 20px; border-right-width: 3px; border-bottom-width: 3px; border-bottom-right-radius: 10px"></span>
<span class="cam-ico"><x-import component-from-global-scope="MatchUp.Icon" name="camera" size="{{i32}}"></x-import><span class="cam-ico__x"><x-import component-from-global-scope="MatchUp.Icon" name="prohibit" weight="bold" size="{{i16}}"></x-import></span></span>
<span class="h3" style="color: var(--text)">Caméra bloquée</span>
<span class="body" style="color: var(--text-secondary)">Tu as refusé l’accès à la caméra : impossible de scanner les QR codes des joueurs.</span>
</div>

<section class="mu-card" aria-labelledby="cam-how" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 4px 16px">
<h2 id="cam-how" class="label" style="margin: 0; color: var(--text-secondary)">Pour l’activer, 30 secondes</h2>
<ol class="cam-steps">
<li><span class="cam-n num-xs">1</span><span class="body" style="flex: 1">Ouvre les <span class="label">Réglages</span> du téléphone</span></li>
<li><span class="cam-n num-xs">2</span><span class="body" style="flex: 1">Touche <span class="label">MatchUp</span></span></li>
<li><span class="cam-n num-xs">3</span><span class="body" style="flex: 1">Active <span class="label">Caméra</span>, puis reviens ici</span><span class="cam-tog" aria-hidden="true"><span></span></span></li>
</ol>
</section>

<div style="display: flex; flex-direction: column; gap: 4px">
<button type="button" class="mu-btn mu-btn--primary mu-btn--l mu-btn--block"><span class="mu-btn__content"><span class="mu-btn__label label-l">Ouvrir les Réglages</span><x-import component-from-global-scope="MatchUp.Icon" name="arrow-square-out" size="{{i20}}"></x-import></span></button>
<a href="OWN-20-Scanner.dc.html" class="mu-btn mu-btn--tertiary mu-btn--l mu-btn--block"><span class="mu-btn__content"><x-import component-from-global-scope="MatchUp.Icon" name="keyboard" size="{{i20}}"></x-import><span class="mu-btn__label label-l">Saisir le code à la main</span></span></a>
</div>
</main>

<x-import component-from-global-scope="MatchUp.TabBar" items="{{tabs}}" value="scan" safe-area="{{sa}}" fab="{{yes}}" dc-props="{{tabStyle}}"></x-import>
<a href="AI-07-Assistant-pro.dc.html" aria-label="Ouvrir l’assistant MatchUp" style="z-index: calc(var(--z-sticky) + 1); position: absolute; right: 16px; bottom: 114px; width: 56px; height: 56px; border-radius: var(--radius-full)"></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, no: false, i16: 16, i20: 20, i24: 24, i32: 32, sa: 34,
      tabs: [
        { value: 'jour', label: 'Aujourd’hui', icon: 'house', href: 'OWN-10-Aujourdhui.dc.html' },
        { value: 'planning', label: 'Planning', icon: 'calendar-blank', href: 'OWN-11-Planning.dc.html' },
        { value: 'scan', label: 'Check-in', icon: 'qr-code', href: 'OWN-20-Scanner.dc.html' },
        { value: 'resa', label: 'Réservations', icon: 'list-checks', href: 'OWN-14-Reservations.dc.html' },
        { value: 'plus', label: 'Plus', icon: 'dots-three', href: 'OWN-15-Plus.dc.html' }
      ],
      tabStyle: { style: { position: 'absolute', left: 0, right: 0, bottom: 0 } }
    };
  }
}
</script>
</body>
</html>
