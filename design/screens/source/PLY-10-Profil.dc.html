<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ton profil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/matchup/tokens.css">
<link rel="stylesheet" href="ds/matchup/components/bundle.css">
<script src="ds/matchup/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} a{color:var(--link)}</style></helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--text); font-family: var(--font-sans)">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 52px 8px 0 8px">
<a href="PLY-09-Notifications.dc.html" class="mu-iconbtn mu-iconbtn--l mu-iconbtn--ghost" aria-label="Retour" style="color: var(--text)"><x-import component-from-global-scope="MatchUp.Icon" name="arrow-left" size="{{i24}}"></x-import></a>
<a href="PLY-11-Accueil-visite.dc.html" class="mu-btn mu-btn--tertiary mu-btn--m"><span class="mu-btn__content"><span class="mu-btn__label label">Passer</span></span></a>
</div>
<div style="padding: 4px 16px 0 16px">
<x-import component-from-global-scope="MatchUp.StepIndicator" step="{{step}}" total="{{total}}" title="Ton profil"></x-import>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px 24px 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="h1" style="margin: 0">Montre-toi</h1>
<p class="body-l" style="margin: 0; color: var(--text-secondary)">Une photo et un pseudo, pour que les joueurs te reconnaissent sur le terrain.</p>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="position: relative; width: 96px; height: 96px">
<x-import component-from-global-scope="MatchUp.Avatar" name="Yassine B." size="xl"></x-import>
<button type="button" class="mu-iconbtn mu-iconbtn--m mu-iconbtn--primary" aria-label="Prendre ou choisir une photo" style="position: absolute; right: -6px; bottom: -6px; box-shadow: 0 0 0 3px var(--surface)"><x-import component-from-global-scope="MatchUp.Icon" name="camera" size="{{i20}}"></x-import></button>
</div>
<button type="button" class="mu-btn mu-btn--tertiary mu-btn--s"><span class="mu-btn__content"><span class="mu-btn__label label">Ajouter une photo</span></span></button>
</div>
<div style="display: flex; flex-direction: column; gap: 20px">
<x-import component-from-global-scope="MatchUp.TextField" label="Pseudo" prefix="@" default-value="yassine.b" autocomplete="username" success="@yassine.b est disponible"></x-import>
<x-import component-from-global-scope="MatchUp.TextField" label="Prénom et nom" default-value="Yassine Belhadj" autocomplete="name" helper="Les autres joueurs voient « Yassine B. », jamais ton nom complet."></x-import>
</div>
</div>
<div style="padding: 12px 16px 34px 16px; background: var(--surface); box-shadow: var(--elevation-2-up); display: flex; flex-direction: column; gap: 12px">
<a href="PLY-11-Accueil-visite.dc.html" class="mu-btn mu-btn--primary mu-btn--xl mu-btn--block"><span class="mu-btn__content"><span class="mu-btn__label label-l">Terminer</span></span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, i20: 20, i24: 24, step: 7, total: 8 }; }
}
</script>
</body>
</html>
