<helmet>
<style>
/* adm:shared — identical in ADM-01…10 */
body{margin:0}
a{color:var(--link)}
.adm-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-3); padding:52px var(--space-2) var(--space-3) var(--space-4)}
.adm-head__titles{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-2)}
.adm-head__title{margin:0}
.adm-role{display:inline-flex; align-items:center; gap:var(--space-1); height:24px; padding:0 10px 0 8px; border-radius:var(--radius-full); background:var(--surface-inverse); color:var(--text-inverse)}
.adm-me{flex:none; width:48px; height:48px; display:grid; place-items:center; border-radius:var(--radius-full); text-decoration:none}
.adm-me:focus-visible,.adm-hot:focus-visible{outline:none; box-shadow:var(--focus-ring)}
.adm-bar{display:flex; align-items:center; gap:var(--space-1); padding:52px var(--space-2) var(--space-2) var(--space-1)}
.adm-bar__titles{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.adm-sec{display:flex; flex-direction:column; gap:var(--space-2); margin:0}
.adm-sec__head{display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:32px}
.adm-sec__title{margin:0; display:flex; align-items:center; gap:var(--space-2)}
.adm-over{margin:0; color:var(--text-secondary)}
.adm-muted{color:var(--text-secondary)}
.adm-list{margin:0; padding:0; list-style:none; background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--elevation-1); overflow:hidden}
.adm-list > li{position:relative}
.adm-list > li + li::before{content:""; position:absolute; top:0; inset-inline-start:var(--space-4); inset-inline-end:0; height:1px; background:var(--border); z-index:1}
.adm-list--inset > li + li::before{inset-inline-start:68px}
.adm-row{position:relative; display:flex; align-items:center; gap:var(--space-3); min-height:64px; padding:var(--space-3) var(--space-4); box-sizing:border-box; color:var(--text); text-decoration:none}
a.adm-row:hover{background:var(--surface-muted)}
a.adm-row:focus-visible{outline:none; box-shadow:inset 0 0 0 2px var(--focus)}
.adm-row--top{align-items:flex-start}
.adm-ico{flex:none; width:40px; height:40px; border-radius:var(--radius-sm); display:grid; place-items:center; background:var(--surface-muted); color:var(--text)}
.adm-ico--error{background:var(--error-soft); color:var(--error-text)}
.adm-ico--warning{background:var(--warning-soft); color:var(--warning-text)}
.adm-ico--info{background:var(--info-soft); color:var(--info-text)}
.adm-ico--ai{background:var(--ai-soft); color:var(--ai-text)}
.adm-ico--success{background:var(--success-soft); color:var(--success-text)}
.adm-txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.adm-one{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.adm-two{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.adm-end{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px; text-align:end}
.adm-chev{flex:none; display:flex; color:var(--text-secondary); margin-inline-end:calc(-1 * var(--space-1))}
.adm-chips{display:flex; gap:var(--space-2); overflow-x:auto; padding:6px var(--space-4); margin:-6px 0; scrollbar-width:none}
.adm-chips::-webkit-scrollbar{display:none}
.adm-chips > *{flex:none}
.adm-meta{display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:40px; padding:0 var(--space-2) 0 var(--space-4)}
.adm-score{flex:none; width:76px; display:flex; flex-direction:column; align-items:flex-end; gap:4px}
.adm-score__top{display:flex; align-items:baseline; gap:4px}
.adm-score__track{width:100%; height:4px; border-radius:var(--radius-full); background:var(--surface-muted); overflow:hidden}
.adm-score__fill{height:100%; border-radius:var(--radius-full)}
.adm-score--high .adm-score__fill{background:var(--error)}
.adm-score--high .adm-score__level{color:var(--error-text)}
.adm-score--mid .adm-score__fill{background:var(--warning)}
.adm-score--mid .adm-score__level{color:var(--warning-text)}
.adm-score--low .adm-score__fill{background:var(--text-secondary)}
.adm-score--low .adm-score__level{color:var(--text-secondary)}
.adm-why{display:flex; align-items:center; gap:6px; color:var(--text-secondary)}
.adm-stickybar{position:absolute; left:0; right:0; bottom:0; z-index:4; display:flex; gap:var(--space-3); padding:12px var(--space-4) 34px var(--space-4); background:var(--surface); box-shadow:var(--elevation-2-up)}
.adm-hot{position:absolute; display:block; border-radius:var(--radius-full); z-index:5}
/* /adm:shared */
.fin-kpis{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:var(--space-3)}
.fin-kpis .mu-kpi{padding:var(--space-4)}
</style>
</helmet>
