# https://minolingo.online (certificate from Let's Encrypt, renewed by certbot's timer).
server {
    listen 443 ssl;
    http2 on;
    server_name minolingo.online www.minolingo.online;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/minolingo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minolingo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/matchup_locations.conf;
}
