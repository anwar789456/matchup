# http://92.222.36.107/api/<module>/... -> the module's own process.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20m;

    location /api/utilisateur/  { proxy_pass http://127.0.0.1:3001; include /etc/nginx/matchup_proxy.conf; }
    location /api/reservation/  { proxy_pass http://127.0.0.1:3002; include /etc/nginx/matchup_proxy.conf; }
    location /api/paiement/     { proxy_pass http://127.0.0.1:3003; include /etc/nginx/matchup_proxy.conf; }
    location /api/tournois/     { proxy_pass http://127.0.0.1:3004; include /etc/nginx/matchup_proxy.conf; }
    location /api/entrainement/ { proxy_pass http://127.0.0.1:3005; include /etc/nginx/matchup_proxy.conf; }
    location /api/forum/        { proxy_pass http://127.0.0.1:3006; include /etc/nginx/matchup_proxy.conf; }

    location /webhook { proxy_pass http://127.0.0.1:9000; include /etc/nginx/matchup_proxy.conf; }

    location = / {
        default_type text/html;
        return 200 '<h1>MatchUp API</h1><ul>
<li><a href="/api/utilisateur/docs">utilisateur</a></li>
<li><a href="/api/reservation/docs">reservation</a></li>
<li><a href="/api/paiement/docs">paiement</a></li>
<li><a href="/api/tournois/docs">tournois</a></li>
<li><a href="/api/entrainement/docs">entrainement</a></li>
<li><a href="/api/forum/docs">forum</a></li>
<li><a href="/webhook/log">deploy log</a></li></ul>';
    }
}
