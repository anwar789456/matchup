# http://92.222.36.107 and http://minolingo.online -> the module's own process.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20m;

    # Let's Encrypt renewals.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    include /etc/nginx/matchup_locations.conf;
}
