name: matchup
description: "MatchUp — amateur sports in Tunisia: find games, book courts, pay your share."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  phosphor_flutter: ^2.1.0
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/sport/
    - assets/logo/
    - assets/illustrations/
    - assets/google_fonts/

# phosphor_flutter 2.1.0 does not compile on current Flutter; see packages/phosphor_flutter/PATCHED.md.
dependency_overrides:
  phosphor_flutter:
    path: packages/phosphor_flutter
