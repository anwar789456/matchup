name: matchup
description: "MatchUp — amateur sports in Tunisia: find games, book courts, pay your share."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/sport/
    - assets/logo/
    - assets/illustrations/

# phosphor_flutter 2.1.0 does not compile on current Flutter; see packages/phosphor_flutter/PATCHED.md.
dependency_overrides:
  phosphor_flutter:
    path: packages/phosphor_flutter
